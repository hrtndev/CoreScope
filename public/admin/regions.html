<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>IATA Regions — CoreScope Admin</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('meshcore-theme');
        var t = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-gated">
  <nav class="top-nav" role="navigation" aria-label="Admin navigation">
    <div class="nav-left">
      <a href="/admin/" class="nav-brand" aria-label="CoreScope Admin"><span class="admin-brand">Admin Management</span></a>
      <div class="nav-links">
        <a href="/admin/" class="nav-link">Admins</a>
        <a href="/admin/infrastructure" class="nav-link">Infrastructure Nodes</a>
        <a href="/admin/regions" class="nav-link active">IATA Regions</a>
        <a href="/admin/hash-regions" class="nav-link">Regions</a>
      </div>
    </div>
    <div class="nav-right">
      <label class="theme-toggle" title="Toggle dark mode">
        <input type="checkbox" id="darkModeCheckbox" role="switch" aria-label="Toggle dark mode">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb"></span>
          <span class="theme-toggle-icon theme-toggle-sun"><svg class="ph-icon" aria-hidden="true"><use href="/icons/phosphor-sprite.svg#ph-sun"></use></svg></span>
          <span class="theme-toggle-icon theme-toggle-moon"><svg class="ph-icon" aria-hidden="true"><use href="/icons/phosphor-sprite.svg#ph-moon"></use></svg></span>
        </span>
      </label>
      <div class="who" id="who"></div>
      <button class="nav-btn hamburger" id="hamburger" title="Menu" aria-label="Toggle navigation menu"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons/phosphor-sprite.svg#ph-list"></use></svg></button>
    </div>
  </nav>

  <main class="admin-page">
    <div class="admin-header">
      <h1>IATA Regions</h1>
      <p>Give observed IATA codes a friendly display name. Names show up in the IATA filter dropdown and are exposed to integrations (e.g. the Discord bot) via the public API.</p>
    </div>

    <div class="admin-section">
      <h2>Configured IATA Regions</h2>
      <div class="form-error" id="regions-error"></div>
      <table class="data-table region-table">
        <colgroup><col style="width:20%"><col style="width:55%"><col style="width:25%"></colgroup>
        <thead>
          <tr><th>Code</th><th>Display Name</th><th></th></tr>
        </thead>
        <tbody id="regions-list"></tbody>
      </table>

      <div class="search-row" id="add-region-row" style="margin-top:16px;">
        <input type="text" id="new-region-code" placeholder="Code (e.g. SJC)" maxlength="32" style="max-width:160px;">
        <input type="text" id="new-region-name" placeholder="Display name (e.g. San Jose, US)" maxlength="100">
        <button class="btn-secondary" id="add-region-btn">+ Add</button>
      </div>

      <div style="margin-top:16px; display:flex; align-items:center; gap:12px;">
        <button class="btn-primary" id="save-regions-btn">Save changes</button>
        <span id="save-status" class="row-error" style="color:var(--text-muted);"></span>
      </div>
    </div>
  </main>

  <script src="theme-toggle.js"></script>
  <script src="account-menu.js"></script>
  <script src="regions.js"></script>
</body>
</html>
